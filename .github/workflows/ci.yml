name: Go package

on: [push]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '^1.27'
          cache: false
      - uses: actions/checkout@v3

      - name: Lint 
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '^1.27'

      - name: Build
        run: go build -v ./...

      - name: Build (simd)
        run: go build -v ./...
        env:
          GOEXPERIMENT: simd

      - name: Test
        run: go test -v ./...

      - name: Test (simd)
        run: go test -v ./...
        env:
          GOEXPERIMENT: simd
